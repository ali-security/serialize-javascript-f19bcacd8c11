name: Test

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Mocha --grep pattern; empty runs the full suite'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx nyc --reporter=lcov mocha test/unit --grep "${{ inputs.test-filter }}"
          else
            npm test
          fi
      - if: matrix.node-version == '20.x'
        run: npm pack
      - name: Upload tgz artifact
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: serialize-javascript-tgz
          path: serialize-javascript-*.tgz
          if-no-files-found: error
          retention-days: 1
